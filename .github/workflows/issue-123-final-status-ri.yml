name: Issue 123 final status RI refresh (temporary)
on:
  push:
    branches:
      - issue-123-final-source-verification
permissions:
  contents: write
jobs:
  regen:
    if: github.event.head_commit.message == 'issue123-final-status-ri-refresh'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean ephemeral workflow, rebuild RI and test
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/issue-123-final-status-ri.yml
          python tools/repository_intelligence.py --config governance/repository-intelligence-config.json build
          python tools/repository_intelligence.py --config governance/repository-intelligence-config.json verify
          python -m unittest discover -s tests -q
          python -m tools.repository_validator
          python -m tools.evidence_state_check
          git diff --check
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email '199175422+chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add governance/repository-intelligence/agent-context.json
          git commit -m 'Refs #123: sync final confirmation into RI'
          git push origin HEAD:issue-123-final-source-verification
