name: Issue 110 record independent acceptance
on:
  push:
    branches: [issue-110-workbench-20261023]
    paths: [.github/workflows/issue-110-record-acceptance.yml]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 939dd0805041debd69fde68a8467aa6202c51bc1
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: issue-110-core-comparison
          path: candidate
          fetch-depth: 0
      - name: Record reviewed receipt without claiming future main
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_COMMENT_ID: '6366174999'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 22c4f589d7d9eb6adfa1b50138dc17e4471acd8f
          python3 - <<'PY'
          import base64,zlib,hashlib
          data=''
          code=zlib.decompress(base64.b64decode(data))
          assert hashlib.sha256(code).hexdigest()=='03b3f47078c94d976e52f2928b997f2e585208ce68857c19b633bc393c44deb6'
          exec(compile(code,'guarded-acceptance-recording.py','exec'))
          PY
          python3 tools/repository_intelligence.py --config governance/repository-intelligence-config.json build
          git diff --check
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 -m tools.repository_validator
          python3 -m tools.evidence_state_check
          python3 tools/repository_intelligence.py --config governance/repository-intelligence-config.json verify
          git config user.name 'ChatGPT implementation agent'
          git config user.email 'noreply@openai.com'
          git add CHANGELOG.md evidence/primary report/appendices/mechanism-hypotheses.md governance
          git commit -m 'Record actual independent acceptance of the nine-source comparison' -m 'Refs #110. Preserve source findings and nonfinal integration states; no future-main verification claim.'
      - name: Trusted gates and guarded publication
        run: |
          set -euo pipefail
          BASE=939dd0805041debd69fde68a8467aa6202c51bc1
          HEAD=$(git -C candidate rev-parse HEAD)
          python3 trusted/tools/repository_gate.py --policy-root trusted --candidate-root candidate --repo candidate --base "$BASE" --head "$HEAD"
          PYTHONPATH=trusted python3 trusted/tools/evidence_state_check.py --policy-root trusted --candidate-root candidate
          PYTHONPATH=trusted python3 trusted/tools/evidence_transition_gate.py --policy-root trusted --candidate-root candidate --repo candidate --base "$BASE"
          test "$(git -C candidate ls-remote origin refs/heads/issue-110-core-comparison | cut -f1)" = 22c4f589d7d9eb6adfa1b50138dc17e4471acd8f
          git -C candidate push origin HEAD:refs/heads/issue-110-core-comparison
          mkdir -p output
          git -C candidate rev-parse HEAD HEAD^{tree} > output/receipt.txt
          git -C candidate diff --stat 22c4f589d7d9eb6adfa1b50138dc17e4471acd8f HEAD >> output/receipt.txt
          git -C candidate archive --format=zip --output="$GITHUB_WORKSPACE/output/candidate.zip" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-110-accepted-recording-candidate
          path: output
          retention-days: 1
