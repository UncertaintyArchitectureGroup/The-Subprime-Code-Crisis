name: Issue 110 bounded original-page reviews
on:
  push:
    branches: [issue-110-workbench-20261023]
    paths: [.github/workflows/issue-110-source-review-v2.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Collect independent page-scoped reports
        run: |
          python3 - <<'PY'
          import concurrent.futures,datetime,json,pathlib,urllib.request
          out=pathlib.Path('reports');out.mkdir()
          root='https://subprime-110-audit-8f31d7.oborskyivitalii.workers.dev/audit-v2-6703c58f95da14b9/'
          ids=['C1a','C1b','C1c','C2a','C2b','C4a','C4b','C8','C5']
          def one(sid):
              try:
                  request=urllib.request.Request(root+sid,headers={'User-Agent':'Issue-110-independent-source-inspection'})
                  with urllib.request.urlopen(request,timeout=180) as response:
                      data=json.loads(response.read())
                  assert data.get('head')=='b4bd013f359acc511fef3c69ae43cba56fa98f88',data
                  assert data.get('id')==sid,data
              except Exception as e:
                  data={'id':sid,'head':'b4bd013f359acc511fef3c69ae43cba56fa98f88','outcome':'Review unavailable','transport_error':str(e)}
              (out/(sid+'.json')).write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
              print(sid,'report_present',bool(data.get('report')),'error',data.get('error',data.get('transport_error','none')),flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:list(pool.map(one,ids))
          (out/'transport.json').write_text(json.dumps({'date':datetime.datetime.now(datetime.timezone.utc).isoformat(),'head':'b4bd013f359acc511fef3c69ae43cba56fa98f88','model':'@cf/nvidia/nemotron-3-120b-a12b','role':'Separate-model explicitly page-scoped original comparison checks; no original documents exported; not whole-PR acceptance','components':ids},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-110-independent-page-reports
          path: reports/
          retention-days: 1
