name: Issue 120 record actual metadata review
on:
  push:
    branches: [issue-100-transfer-20261024]
    paths: [.github/workflows/issue-100-record-review.yml]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    env:
      BASE: 7e40c0b7930d4a014483b51eda68dbed802c73e7
      EXPECTED: 54667f4cc611e99859748e0584505fe432810016
      TARGET: issue-120-final-verification
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 54667f4cc611e99859748e0584505fe432810016
          fetch-depth: 0
      - name: Record only the actual independent outcome
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$(git ls-remote origin refs/heads/$TARGET | cut -f1)" = "$EXPECTED"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          mkdir -p /tmp/trusted /tmp/issue120-review
          git archive "$BASE" | tar -x -C /tmp/trusted
          python - <<'PY'
          from pathlib import Path
          import urllib.request,json,os,subprocess
          URL='https://github.com/UncertaintyArchitectureGroup/The-Subprime-Code-Crisis'
          receipt='6383096812'; link=f'{URL}/pull/122#issuecomment-{receipt}'
          req=urllib.request.Request(f'https://api.github.com/repos/UncertaintyArchitectureGroup/The-Subprime-Code-Crisis/issues/comments/{receipt}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          obj=json.load(urllib.request.urlopen(req))
          assert obj['user']['login']=='chatgpt-codex-connector[bot]'
          assert '## Independent audit — **Confirmed**' in obj['body'] and os.environ['EXPECTED'] in obj['body']
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()=='9ef2dbef938402cad17e6fd21c49ddec22545032'
          p=Path('governance/work-records/2026-10-24-issue-120-final-verification.toml');s=p.read_text()
          assert s.count('independent_review = "Review unavailable"')==1
          s=s.replace('independent_review = "Review unavailable"','independent_review = "Confirmed"',1)
          s=s.replace('# Metadata-delta review is pending; prior source/main acceptance does not certify this delta.',f'# Actual metadata-delta acceptance: {link}; head54667f4/tree9ef2dbef. Not future-main acceptance.')
          p.write_text(s)
          p=Path('governance/reviews/issue-120-2026-10-24-final-verification.md');s=p.read_text()
          needle='The completed source and actual-main reviews are **Confirmed** in their stated scopes. The independent outcome for this metadata delta is initially **Review unavailable**, pending an actual scoped report in [#120](https://github.com/UncertaintyArchitectureGroup/The-Subprime-Code-Crisis/issues/120). This is not a claim that the metadata PR is accepted or ready to merge. The new work record must record the actual metadata-review outcome before merge; no future result is asserted here.'
          assert s.count(needle)==1
          replacement=f'The completed source and actual-main reviews are **Confirmed** in their stated scopes. The first metadata-review attempt returned [Review unavailable]({URL}/issues/120#issuecomment-6383042391) because its issue-context checkout lacked the candidate. The separate PR-context reviewer subsequently returned [Confirmed]({link}) for exact head `54667f4cc611e99859748e0584505fe432810016`, tree `9ef2dbef938402cad17e6fd21c49ddec22545032`. This paragraph and the new work record record that actual outcome, not a future merge or final-main acceptance. The candidate review is reused only for the unchanged accepted metadata; the recording delta and actual resulting main retain their applicable checks.'
          p.write_text(s.replace(needle,replacement))
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())=={'governance/work-records/2026-10-24-issue-120-final-verification.toml','governance/reviews/issue-120-2026-10-24-final-verification.md'}
          PY
      - name: Validate the three-path recording delta
        run: |
          python tools/repository_intelligence.py --config governance/repository-intelligence-config.json build
          git add governance/work-records/2026-10-24-issue-120-final-verification.toml governance/reviews/issue-120-2026-10-24-final-verification.md governance/repository-intelligence/agent-context.json
          test "$(git diff --cached --name-only | wc -l)" = 3
          test "$(git write-tree)" = d0537d607572434b5ae121a18b0ec40c16012ca3
          git diff --cached --exit-code -- evidence report protocols README.md REFERENCES.md AGENTS.md DOCTRINE.md GLOSSARY.md CONTRIBUTING.md CHANGELOG.md tools tests .github governance/memory.md
          python -m unittest discover -s tests -p 'test_*.py' > /tmp/issue120-review/tests.log 2>&1
          python -m tools.repository_validator
          python -m tools.evidence_state_check
          python tools/repository_intelligence.py --config governance/repository-intelligence-config.json verify
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record actual independent metadata acceptance for issue120' -m 'Refs #120, #100. Receipt6383096812; three-path recording only, accepted sources and status pairs unchanged.'
          PYTHONPATH=/tmp/trusted python /tmp/trusted/tools/repository_gate.py --policy-root /tmp/trusted --candidate-root "$PWD" --repo "$PWD" --base "$BASE" --head HEAD
          PYTHONPATH=/tmp/trusted python /tmp/trusted/tools/evidence_state_check.py --policy-root /tmp/trusted --candidate-root "$PWD"
          PYTHONPATH=/tmp/trusted python /tmp/trusted/tools/evidence_transition_gate.py --policy-root /tmp/trusted --candidate-root "$PWD" --repo "$PWD" --base "$BASE"
          test "$(git ls-remote origin refs/heads/$TARGET | cut -f1)" = "$EXPECTED"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          git push origin HEAD:refs/heads/$TARGET
          git show -s --format='%H %T %P' HEAD > /tmp/issue120-review/identity.txt
          git diff --binary "$EXPECTED" HEAD > /tmp/issue120-review/recording.patch
          git archive --format=zip HEAD > /tmp/issue120-review/repository.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue120-recorded-review
          path: /tmp/issue120-review/
          retention-days: 3
          if-no-files-found: error
