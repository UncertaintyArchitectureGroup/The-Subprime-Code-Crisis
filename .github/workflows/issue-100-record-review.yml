name: Issue 121 guarded plan checkpoint
on:
  push:
    branches: [issue-100-transfer-20261024]
    paths: [.github/workflows/issue-100-record-review.yml]
permissions:
  contents: read
  issues: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Update only four current-status fields in issue 84
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.request, difflib
          REPO = 'UncertaintyArchitectureGroup/The-Subprime-Code-Crisis'
          API = 'https://api.github.com/repos/' + REPO
          URL = 'https://github.com/' + REPO
          MAIN = '0aaccd7311af65727ddf0077f9ca605def967d22'
          EXPECTED_BODY = 'd5fe47739aebb1efdbc54107a3819518f49930d4e14321d868dfd1cc42c28422'
          HEADER = f'> **Current state — 2026-10-24:** #85, #65, #86, #87, #4, #109, #110 and #111 are completed; the #88 plain-language pass is merged through #114. **#100 approved content and all seven source flows are complete** through [PR #118]({URL}/pull/118) and [PR #122]({URL}/pull/122), accepted main `{MAIN}`. #119/#120 are completed; #121 records the final administrative closeout. [Parent acceptance mapping]({URL}/issues/100#issuecomment-6383323067) · [Current plan and next scope]({URL}/issues/84#issuecomment-6383326966). **Next proposed work: remaining #88 with #1 reader acceptance; implementation has not started.** This master issue remains open. Earlier status statements below are dated history; source follow-ups and all-node research are not first-edition prerequisites.'
          REPLACEMENTS = {
              '| 7 | **#111** |': 'Completed via #117; exact main b72b50e accepted. Candidate source follow-ups remain separately selected, not an indefinite edition blocker',
              '| 8 | **#100** |': 'Completed via #118/#122; seven sources Verified/2026-10-24 on main0aaccd7. #119/#120 complete; #121 records parent closeout. H0-C/MKT-1 remain Open',
              '| 9 | **#88**,': 'Language pass completed via #114; remaining first edition is the next proposal with #110/#111/#100 inputs ready. Not started by #121; all-node research is not a prerequisite',
          }
          def sha(text): return hashlib.sha256(text.encode()).hexdigest()
          def patch(body):
              assert sha(body) == EXPECTED_BODY, 'Unexpected body; stop rather than overwrite'
              old_header, tail = body.split('\n\n', 1)
              assert old_header.startswith('> **Current state — 2026-10-23:**')
              changed = []
              lines = tail.splitlines(keepends=True)
              for prefix, status in REPLACEMENTS.items():
                  matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
                  assert len(matches) == 1, (prefix, matches)
                  i = matches[0]; old = lines[i]
                  parts = old.rstrip('\n').split('|')
                  assert len(parts) == 6, parts
                  parts[-2] = ' ' + status + ' '
                  new = '|'.join(parts) + ('\n' if old.endswith('\n') else '')
                  lines[i] = new; changed.append((old, new))
              new_tail = ''.join(lines)
              restored = new_tail
              for old, new in changed: restored = restored.replace(new, old, 1)
              assert restored == tail, 'History changed beyond three status cells'
              result = HEADER + '\n\n' + new_tail
              assert result.count('- [x] **AC-') == body.count('- [x] **AC-') == 2
              assert sha(result) == '03cb8ce5d29f3131a4359614b1872969e0e0ed3cc4df09f9395154405dd627d0'
              return result
          def api(path, data=None):
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
              raw = None if data is None else json.dumps(data).encode()
              if raw is not None: headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(API + path, data=raw, headers=headers, method='GET' if data is None else 'PATCH')
              with urllib.request.urlopen(req, timeout=30) as res: return json.load(res)
          out = pathlib.Path('/tmp/issue121-plan'); out.mkdir(exist_ok=True)
          assert api('/git/ref/heads/main')['object']['sha'] == MAIN
          for issue in (119, 120): assert api(f'/issues/{issue}')['state'] == 'closed'
          for number, expected in ((118, '7e40c0b7930d4a014483b51eda68dbed802c73e7'), (122, MAIN)):
              pr = api(f'/pulls/{number}'); assert pr['merged'] and pr['merge_commit_sha'] == expected
          run = api('/actions/runs/40086484869')
          assert run['head_sha'] == MAIN and run['conclusion'] == 'success'
          original = api('/issues/84'); before = original['body']; after = patch(before)
          (out/'84-before.json').write_text(json.dumps(original, ensure_ascii=False, indent=2))
          (out/'84-after-body.md').write_text(after)
          (out/'84-body.diff').write_text(''.join(difflib.unified_diff(before.splitlines(True), after.splitlines(True), fromfile='before', tofile='after')))
          assert api('/issues/84')['body'] == before, 'Concurrent update; stop'
          result = api('/issues/84', {'body': after})
          assert result['body'] == after and result['state'] == 'open'
          assert api('/git/ref/heads/main')['object']['sha'] == MAIN
          summary = {'issue':84,'before_sha256':sha(before),'after_sha256':sha(after),'changes':'current header and exactly three current-sequence status cells; all other body bytes preserved','main':MAIN,'master_state':'open','repository_content_changed':False}
          (out/'result.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue121-plan-checkpoint
          path: /tmp/issue121-plan/
          retention-days: 3
          if-no-files-found: warn
