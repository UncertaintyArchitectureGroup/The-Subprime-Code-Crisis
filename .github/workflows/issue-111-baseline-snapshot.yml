name: Issue 111 pinned baseline snapshot
on:
  push:
    branches: [issue-111-workbench-20261023]
    paths: [.github/workflows/issue-111-baseline-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9fbf674d58f0dedb10a2bc22bd825699589142be
          persist-credentials: false
      - name: Archive exact public baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9fbf674d58f0dedb10a2bc22bd825699589142be
          test "$(git rev-parse HEAD^{tree})" = 2fd3b46a2e4c41009639a1ee97395a5313c1c755
          mkdir -p /tmp/issue-111-baseline
          git archive --format=zip --output=/tmp/issue-111-baseline/baseline.zip HEAD
          git rev-parse HEAD HEAD^{tree} > /tmp/issue-111-baseline/identity.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-111-baseline
          path: /tmp/issue-111-baseline/
          retention-days: 1
          if-no-files-found: error
