name: Issue 111 publish primary packet
on:
  push:
    branches: [issue-111-workbench-20261023]
    paths: [.github/workflows/issue-111-publish-packet.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: 9fbf674d58f0dedb10a2bc22bd825699589142be
      TARGET: issue-111-bounded-discovery
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9fbf674d58f0dedb10a2bc22bd825699589142be
          fetch-depth: 0
      - name: Verify baseline and receive exact authored patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)" = "$BASE"
          test -z "$(git ls-remote --heads origin refs/heads/$TARGET)"
          git worktree add --detach /tmp/issue111-trusted "$BASE"
          python3 - <<'PY'
          import base64,hashlib,json,lzma,subprocess,pathlib
          repo='UncertaintyArchitectureGroup/The-Subprime-Code-Crisis'
          pieces=[]
          for sha in ['e72c3643134d8dc266ac873a1a5e754c25b00fd1','f62edd3610b0e2cd6f2fae6f6eef62ec73d3d34b']:
              obj=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/git/blobs/{sha}']))
              assert obj['sha']==sha and obj['encoding']=='base64'
              pieces.append(base64.b64decode(obj['content']))
          patch=lzma.decompress(b''.join(pieces))
          assert hashlib.sha256(patch).hexdigest()=='2ba18e17aaab28f32feb221b7e14feacdab91a2e97097f495ca7ed8b2a8cc7f1'
          pathlib.Path('/tmp/issue111.patch').write_bytes(patch)
          allowed={'CHANGELOG.md','governance/README.md','governance/memory.md','governance/reviews/issue-111-2026-10-23-candidates.json','governance/reviews/issue-111-2026-10-23-queries.json','governance/reviews/issue-111-2026-10-23-search.md','governance/reviews/issue-111-2026-10-23-strategy.md','governance/work-records/2026-10-23-issue-111-discovery.toml'}
          stats=subprocess.check_output(['git','apply','--numstat','/tmp/issue111.patch'],text=True)
          assert {line.split('\t',2)[2] for line in stats.splitlines()}==allowed
          PY
          git apply --check /tmp/issue111.patch
          git apply /tmp/issue111.patch
          git switch -c "$TARGET"
      - name: Rebuild and test without changing policy
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/repository_intelligence.py --config governance/repository-intelligence-config.json build
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m tools.repository_validator
          python3 -m tools.evidence_state_check
          python3 tools/repository_intelligence.py --config governance/repository-intelligence-config.json verify
          python3 - <<'PY'
          import json,pathlib,collections
          r=pathlib.Path('governance/reviews')
          c=json.loads((r/'issue-111-2026-10-23-candidates.json').read_text())['candidates']
          q=json.loads((r/'issue-111-2026-10-23-queries.json').read_text())
          assert len(c)==23 and len({x['id'] for x in c})==23
          assert len(q['queries'])==18 and len(q['followups'])==6
          assert collections.Counter(x['routing'] for x in c)=={'Accept for Flow A':11,'Context only':5,'Reject':4,'Hold':3}
          PY
          git diff --check
          test -z "$(git diff --name-only -- evidence report protocols README.md REFERENCES.md AGENTS.md DOCTRINE.md GLOSSARY.md CONTRIBUTING.md .github tools tests)"
          git add CHANGELOG.md governance
          test "$(git write-tree)" = ad61b1fcc08ce2cea1475c1397b1357ec5e05e0e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record bounded discovery on capacity, understanding and control value' -m 'Refs #111. Provisional primary packet; independent Search Review unavailable. No claim, source-state or policy changes.'
          PYTHONPATH=/tmp/issue111-trusted python3 /tmp/issue111-trusted/tools/repository_gate.py --policy-root /tmp/issue111-trusted --candidate-root . --repo . --base "$BASE" --head HEAD
          PYTHONPATH=/tmp/issue111-trusted python3 /tmp/issue111-trusted/tools/evidence_transition_gate.py --policy-root /tmp/issue111-trusted --candidate-root . --repo . --base "$BASE"
      - name: Publish only the new draft content branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)" = "$BASE"
          test -z "$(git ls-remote --heads origin refs/heads/$TARGET)"
          git push origin HEAD:refs/heads/$TARGET
          printf 'Published candidate: '; git rev-parse HEAD
          printf 'Published tree: '; git rev-parse HEAD^{tree}
          echo 'Independent Search Review remains unavailable. No merge or issue closure.'
