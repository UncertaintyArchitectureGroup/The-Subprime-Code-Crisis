name: Repository Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  repository-gate:
    name: Repository Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out trusted base governance
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 0

      - name: Check out candidate repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch comparison base into candidate checkout
        working-directory: candidate
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"

      - name: Validate candidate with trusted base gate
        run: >-
          python3 trusted/tools/repository_gate.py
          --root candidate
          --repo candidate
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
