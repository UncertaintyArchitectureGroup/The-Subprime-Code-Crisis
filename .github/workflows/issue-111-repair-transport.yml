name: Issue 111 correction object preparation
on:
  push:
    branches: [issue-111-workbench-20261023]
    paths: [.github/workflows/issue-111-repair-transport.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact existing PR candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 65b1341210bd4c9fa3559385e6e149ebcf8a2df0
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Check out unchanged trusted policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9fbf674d58f0dedb10a2bc22bd825699589142be
          path: trusted
          persist-credentials: false
      - name: Verify and apply only the authored correction
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, base64, gzip, hashlib, pathlib, subprocess, urllib.request
          repo='UncertaintyArchitectureGroup/The-Subprime-Code-Crisis'
          root=pathlib.Path('candidate')
          head='65b1341210bd4c9fa3559385e6e149ebcf8a2df0'
          main='9fbf674d58f0dedb10a2bc22bd825699589142be'
          expected='203ee9d4042a0b695778717523435cfb5441b994'
          def api(path):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=45) as r: return json.load(r)
          assert api('git/ref/heads/main')['object']['sha']==main
          assert api('git/ref/heads/issue-111-bounded-discovery')['object']['sha']==head
          chunks=['25c7b3124fdcadf0d1b1b94bfd87aa27b5a6a34c','40c90256f846cee4fea977e2129f2655206e2a25','4e1c4e2be4ff6f6ca148f5a0f0494350578f0c16','36a4771bdb7926a01e3e38558c4c264b5f42989a','0d36c33504166d7b5e0ca0b593a8875e3f5320ff','769ae504cdc3d0f39c7399cf3e80b1b7d9774857','13a8ef44159934b273afdaaa6c64ba312349edfa','4a07436bf7d727829878c2b3d306672f0eb8762e','60a01f79551541ae93889ec4b5c6b3a2d46064a5','d02c4a6d2d34ee954fb255815baedfcdac7266e3','18e483d20b2e5beca55a1595c0be504c7f1419f8','11465201bcc5c3bf5c6e25e278d6d65408e71ccf','62ccc5cf8eb7ca1c50a9c27dec474978c536095e','0fdf933fc5d2656f1ec6d537eb23d6d26793c4ce','e1b4feb70cbe97f2af9c30b8e5c27e82a9188fa7']
          encoded=b''
          for sha in chunks:
              o=api('git/blobs/'+sha)
              b=base64.b64decode(o['content'])
              assert hashlib.sha1(('blob '+str(len(b))+'\0').encode()+b).hexdigest()==sha
              encoded+=b
          assert len(encoded)==32384
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert len(patch)==110079
          assert hashlib.sha256(patch).hexdigest()=='de176cfe98014415949d0cfc0c9498cd03c51cef48c027b5f38c803eb39284bb'
          subprocess.run(['git','apply','--check','-'],cwd=root,input=patch,check=True)
          subprocess.run(['git','apply','-'],cwd=root,input=patch,check=True)
          allowed=['CHANGELOG.md','governance/memory.md','governance/repository-intelligence/agent-context.json','governance/reviews/issue-111-2026-10-23-candidates-continuation.json','governance/reviews/issue-111-2026-10-23-correction.md','governance/reviews/issue-111-2026-10-23-rerun.md','governance/reviews/issue-111-2026-10-23-search.md','governance/work-records/2026-10-23-issue-111-discovery.toml']
          subprocess.run(['git','add','--',*allowed],cwd=root,check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],cwd=root,text=True).splitlines()
          assert sorted(changed)==sorted(allowed),changed
          tree=subprocess.check_output(['git','write-tree'],cwd=root,text=True).strip()
          assert tree==expected,(tree,expected)
          for p in allowed: assert (root/p).is_file() and not (root/p).is_symlink()
          subprocess.run(['git','diff','--check','--cached'],cwd=root,check=True)
          subprocess.run(['git','config','user.name','Issue 111 validation'],cwd=root,check=True)
          subprocess.run(['git','config','user.email','actions@users.noreply.github.com'],cwd=root,check=True)
          subprocess.run(['git','commit','-m','Local-only validation of hash-checked issue111 correction'],cwd=root,check=True)
          pathlib.Path('repair-paths.json').write_text(json.dumps(allowed))
          print(json.dumps({'patch_sha256':hashlib.sha256(patch).hexdigest(),'validated_tree':tree,'changed_paths':changed}))
          PY
      - name: Run unchanged tests and trusted gates
        run: |
          set -euo pipefail
          cd candidate
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m tools.repository_validator
          python3 -m tools.evidence_state_check
          python3 tools/repository_intelligence.py --config governance/repository-intelligence-config.json verify
          PYTHONPATH=../trusted python3 ../trusted/tools/repository_gate.py --policy-root ../trusted --candidate-root . --repo . --base 9fbf674d58f0dedb10a2bc22bd825699589142be --head HEAD
          PYTHONPATH=../trusted python3 ../trusted/tools/evidence_transition_gate.py --policy-root ../trusted --candidate-root . --repo . --base 9fbf674d58f0dedb10a2bc22bd825699589142be
          git diff --quiet 65b1341210bd4c9fa3559385e6e149ebcf8a2df0 HEAD -- evidence report protocols README.md REFERENCES.md AGENTS.md DOCTRINE.md GLOSSARY.md CONTRIBUTING.md tools tests .github governance/reviews/issue-111-2026-10-23-strategy.md governance/reviews/issue-111-2026-10-23-queries.json governance/reviews/issue-111-2026-10-23-candidates.json
      - name: Upload only tested Git objects, without moving any branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,base64,pathlib,urllib.request
          repo='UncertaintyArchitectureGroup/The-Subprime-Code-Crisis'
          def api(path,data=None):
              body=None if data is None else json.dumps(data).encode()
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,data=body,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=45) as r: return json.load(r)
          assert api('git/ref/heads/main')['object']['sha']=='9fbf674d58f0dedb10a2bc22bd825699589142be'
          assert api('git/ref/heads/issue-111-bounded-discovery')['object']['sha']=='65b1341210bd4c9fa3559385e6e149ebcf8a2df0'
          paths=json.loads(pathlib.Path('repair-paths.json').read_text())
          entries=[]
          for path in paths:
              data=(pathlib.Path('candidate')/path).read_bytes()
              obj=api('git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              entries.append({'path':path,'mode':'100644','type':'blob','sha':obj['sha']})
          result=api('git/trees',{'base_tree':'ad61b1fcc08ce2cea1475c1397b1357ec5e05e0e','tree':entries})
          assert result['sha']=='203ee9d4042a0b695778717523435cfb5441b994'
          print('PREPARED_CORRECTION_OBJECTS '+json.dumps({'tree':result['sha'],'parent':'65b1341210bd4c9fa3559385e6e149ebcf8a2df0','paths':paths,'branches_moved':False}))
          PY
