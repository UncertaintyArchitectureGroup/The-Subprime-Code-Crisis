name: Issue 111 record completed acceptance
on:
  push:
    branches: [issue-111-workbench-20261023]
    paths: [.github/workflows/issue-111-record-search-acceptance.yml]
permissions:
  contents: write
  issues: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: babeb8d51a129142a4eb5aba148a1ce646bd47be
          fetch-depth: 0
      - name: Verify actual acceptance and apply recording
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 9fbf674d58f0dedb10a2bc22bd825699589142be
          test "$(git ls-remote origin refs/heads/issue-111-bounded-discovery | cut -f1)" = babeb8d51a129142a4eb5aba148a1ce646bd47be
          gh api repos/UncertaintyArchitectureGroup/The-Subprime-Code-Crisis/issues/comments/6373238690 > /tmp/receipt.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          note=json.loads(Path('/tmp/receipt.json').read_text())
          assert note['user']['login']=='chatgpt-codex-connector[bot]'
          assert 'Canonical whole-Flow-E outcome: `Confirmed`' in note['body']
          assert 'babeb8d51a129142a4eb5aba148a1ce646bd47be' in note['body']
          assert '26c8d7af689e263905bd07054624c6af0a59f52c' in note['body']
          root=Path('.'); r=root/'governance/reviews'
          receipt='https://github.com/UncertaintyArchitectureGroup/The-Subprime-Code-Crisis/pull/117#issuecomment-6373238690'
          p=r/'issue-111-2026-10-23-candidates-continuation.json';d=json.loads(p.read_text());d['status']='Independent Search Review Confirmed for the corrected bounded discovery packet at babeb8d51a129142a4eb5aba148a1ce646bd47be; routes remain provisional for later source review, not accepted evidence.'
          d['review_correction']['acceptance_receipt']=receipt
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          p=root/'governance/work-records/2026-10-23-issue-111-discovery.toml';s=p.read_text();assert 'independent_review = "Corrections required"' in s
          s=s.replace('independent_review = "Corrections required"','independent_review = "Confirmed"')
          s=s.replace('# Completed review: https://github.com/UncertaintyArchitectureGroup/The-Subprime-Code-Crisis/pull/117#discussion_r4362922817; repeat review of fixes remains pending.','# Whole-Flow-E acceptance: '+receipt+'; exact reviewed babeb8d5/tree26c8d7af. Final recording/merge/main checks remain separate.')
          p.write_text(s)
          p=r/'issue-111-2026-10-23-search.md';s=p.read_text();first,rest=s.split('\n',1);assert first.startswith('> **Current review correction')
          first='> **Current acceptance — 2026-10-23:** independent Search Review is **Confirmed** for the corrected bounded packet ([complete report]('+receipt+')). The current register has **53 objects: 14 proposed Flow A, 17 Hold, 15 Context only, 7 Reject; 24 primary full-text/passage screens**. This accepts the search and its record, not the candidate sources or a new thesis verdict. The [correction record](issue-111-2026-10-23-correction.md#independent-acceptance--23-october-2026) preserves the review scope and access limits. Final recording, merge/main checks and issue closeout are recorded separately in the live PR.'
          p.write_text(first+'\n'+rest)
          p=r/'issue-111-2026-10-23-correction.md';s=p.read_text();s=s.replace('**23 October 2026. Independent review returned Corrections required. Targeted fixes below await repeat acceptance.**','**23 October 2026. Independent Search Review: Confirmed. Earlier correction checkpoints below are history; the final acceptance record is at the end.**')
          s+='''
          ## Independent acceptance — 23 October 2026

          **Flow E outcome: Confirmed.** Separate reviewer `chatgpt-codex-connector[bot]` returned the [complete public acceptance note](https://github.com/UncertaintyArchitectureGroup/The-Subprime-Code-Crisis/pull/117#issuecomment-6373238690) for exact head `babeb8d51a129142a4eb5aba148a1ce646bd47be`, tree `26c8d7af689e263905bd07054624c6af0a59f52c`, against main `9fbf674d58f0dedb10a2bc22bd825699589142be`. Primary searcher and correction author: ChatGPT coordinator; the acceptance reviewer did not author the published corrections. No new human decision or material defect remained.

          The reviewer checked the complete original/corrected packet, all five finding dispositions, 53 unique candidates and routes, 24 full-text/passage screens, the 18-query ledger (149 displayed hits, 108 distinct URLs, five-lead limit), version/access boundaries, preservation, navigation, handoff and RI. It ran 126 tests, contract, state integrity, fresh RI, trusted full-PR Repository Gate and transition checks; all passed.

          It reused the completed representative-query, four omission-family, original/reference and held/excluded checks in reviews r4362922817/r4363491743 only in their real scope. Its new D48 URL attempt returned no page through the web opener and HTTP403 through direct access. It did not claim a fresh original reading, raw replication or successful native database access. The coordinator's D48 abstract check and historical successful independent searches remain separately attributed.

          D52/D53 and current editions D38/D42 remain Hold with later owners; D48 remains an adjacent learning-process/control lead, not demonstrated retention or net value. These explicit later source tasks do not prevent acceptance of the finite search. No source state, report claim, hypothesis verdict or protocol changed.

          This short receipt records the actual outcome, not a new scientific assessment. Candidate records and the frozen history are otherwise unchanged. It does not assert a future merge, final-main acceptance, #111 closure or #100 selection. Final recording checks and the actual post-merge/issue records belong in the live PR and issues; no recursive receipt-only PR is required.
          '''
          p.write_text(s)
          p=root/'governance/memory.md';s=p.read_text()
          s=s.replace('- A completed independent search review returned Corrections required. The current correction addresses its original four findings and the repeat-review D48 mapping finding; repeat acceptance is pending.','- Separate independent Search Review is Confirmed for corrected head `babeb8d51a129142a4eb5aba148a1ce646bd47be`, tree `26c8d7af689e263905bd07054624c6af0a59f52c`; receipt6373238690.\n- This recording does not claim future merge, main verification or issue closure.')
          s=s.replace('- Verify the published correction, then obtain separate independent correction acceptance; do not treat implementation as self-approval.','- Verify faithful recording and exact-head checks; completed search acceptance is not repeated or self-issued.')
          p.write_text(s)
          p=root/'CHANGELOG.md';s=p.read_text().replace('- Recorded the actual Corrections required outcome; repeat acceptance remains pending.','- Recorded the actual whole-search Confirmed acceptance after correction; final merge/main checks are separate.',1);p.write_text(s)
          PY
          python3 tools/repository_intelligence.py --config governance/repository-intelligence-config.json build
          git add CHANGELOG.md governance
          test "$(git write-tree)" = 181615bcde9068ceb1c995b2f90b12b5866472d2
      - name: Validate and publish recording object without moving the PR
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -q
          python3 -m tools.repository_validator
          python3 -m tools.evidence_state_check
          python3 tools/repository_intelligence.py --config governance/repository-intelligence-config.json verify
          git diff --cached --check
          git diff --cached --exit-code -- evidence report protocols AGENTS.md README.md REFERENCES.md DOCTRINE.md GLOSSARY.md tools tests governance/reviews/issue-111-2026-10-23-strategy.md governance/reviews/issue-111-2026-10-23-queries.json governance/reviews/issue-111-2026-10-23-candidates.json governance/reviews/issue-111-2026-10-23-rerun.md
          python3 - <<'PY'
          import json,subprocess
          p='governance/reviews/issue-111-2026-10-23-candidates-continuation.json'
          old=json.loads(subprocess.check_output(['git','show','HEAD:'+p],text=True))
          new=json.load(open(p));assert old['candidates']==new['candidates']
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record completed independent #111 search acceptance' -m 'Refs #111. Faithful receipt6373238690 only; source/candidate facts and frozen search history unchanged. Final merge/main and issue closeout remain separate.'
          git worktree add --detach /tmp/trusted 9fbf674d58f0dedb10a2bc22bd825699589142be
          PYTHONPATH=/tmp/trusted python3 /tmp/trusted/tools/repository_gate.py --policy-root /tmp/trusted --candidate-root "$PWD" --repo "$PWD" --base 9fbf674d58f0dedb10a2bc22bd825699589142be --head HEAD
          PYTHONPATH=/tmp/trusted python3 /tmp/trusted/tools/evidence_transition_gate.py --policy-root /tmp/trusted --candidate-root "$PWD" --repo "$PWD" --base 9fbf674d58f0dedb10a2bc22bd825699589142be
          test -z "$(git ls-remote origin refs/heads/issue-111-accepted-recording)"
          git push origin HEAD:refs/heads/issue-111-accepted-recording
          git show -s --format='%H %T %P' HEAD
