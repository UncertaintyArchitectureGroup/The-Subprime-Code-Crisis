name: Issue 110 isolated review corrections
on:
  push:
    branches: [issue-110-workbench-20261023]
    paths: [.github/workflows/issue-110-corrections.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 939dd0805041debd69fde68a8467aa6202c51bc1
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: issue-110-core-comparison
          path: candidate
          fetch-depth: 0
      - name: Apply exact reviewed corrections
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a59c2f0d72366bef8cdddfa689f524fcda7ecd51
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 939dd0805041debd69fde68a8467aa6202c51bc1
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); t=p.read_text(); assert t.count(old)==1, (path, t.count(old)); p.write_text(t.replace(old,new,1))
          reg='report/appendices/mechanism-hypotheses.md'
          replace(reg, '[Original author surface](https://www.mertdemirer.com/Papers/Demirer_Writing_vs_shipping_code.pdf)', '[Accepted publisher original](https://www.nber.org/system/files/working_papers/w35275/w35275.pdf)')
          replace(reg, '**Source observation and scope.** A selected 718-firm observational adoption panel; outcomes are firm-month measures, not labor-hour productivity. Agents\' pooled coefficients imply about +29.8% added lines and +20.2% commits. Resolved issues rise by an uncertain +3.3%; a derived normal interval is roughly −6% to +12%.', '**Source observation and scope.** The source covers 718 selected firms overall; outcome-specific regression firm counts are not reported. The adoption analysis uses firm-month observations. Coding and tracked-completion totals are divided by active Jellyfish workers in each firm-month, not by labor-hours. On this per-active-worker-month basis, agents\' pooled coefficients imply about +29.8% added lines, +20.2% commits and an uncertain +3.3% resolved issues; a derived normal interval for resolved issues is roughly −6% to +12%.')
          brief='evidence/primary/2026-chen-stratton-firm-production.md'
          replace(brief, 'independent_review = "Review unavailable"', 'independent_review = "Corrections required"')
          replace(brief, 'Independent review of this new comparison is **Review unavailable**; earlier\nConfirmed reviews certify their own accepted uses, not this candidate.', 'Independent review of this new comparison returned **Corrections required**.\nThe correction distinguishes total firm coverage from the unknown regression\nfirm counts and restores the per-active-worker-month denominator. Repeated\nindependent acceptance remains pending; earlier Confirmed reviews certify their\nown accepted uses, not this candidate.')
          p=Path('governance/reviews/issue-110-2026-10-23-integration.md')
          t=p.read_text().replace('[one P1 finding]', '[a P1 finding]',1)
          t += '''\n\n## Follow-up corrections: original link and analysis denominator — 2026-10-23\n\nThe initial review also contained [P2 4358367881](https://github.com/UncertaintyArchitectureGroup/The-Subprime-Code-Crisis/pull/115#discussion_r4358367881), omitted from the earlier summary above. The later [P1 4358595846](https://github.com/UncertaintyArchitectureGroup/The-Subprime-Code-Crisis/pull/115#discussion_r4358595846) identified the remaining wrong direct original link. Both are now implemented within the already approved T1–T4 scope:\n\n- C1 links directly to the NBER publisher object whose accepted hash was reacquired; it no longer directs readers to the different author copy. No source identity or estimate changes.\n- C2 states 718 as overall source coverage, leaves outcome-specific regression counts unknown, and names the per-active-Jellyfish-worker-month denominator for coding/completion estimates. Merge latency remains elapsed days. No coefficient or inference is promoted.\n- The Chen–Stratton current independent-review field now records Corrections required, rather than unavailable; its original findings and historical acceptance remain untouched.\n- This record corrects the earlier incomplete finding inventory. A generic no-major-issues receipt did not establish that the denominator issue or full original-source scope was accepted.\n\nCanonical governance, all hypothesis verdicts, existing report chapters, numeric inputs and protocols remain unchanged. Required synchronization is confined to the two comparisons, this record, the affected source note, memory and RI. The existing PR changelog/work-record scope remains applicable. No new work record is added to the same PR.\n\nPrimary checks run for this correction are recorded by the isolated job and subsequent published-head checks; this paragraph does not predeclare their success. Independent acceptance, correction merge, actual-main checks and final verification remain pending. #110 stays active and #111 is not started.\n'''
          p.write_text(t)
          p=Path('governance/memory.md');t=p.read_text();t=t.replace('## Next actions', '- Follow-up corrections restore C2\'s per-active-worker-month denominator and\n  unknown regression count; C1 now links to the authenticated publisher object.\n  Initial P2 and later P1 findings are recorded; repeated acceptance is pending.\n\n## Next actions',1);p.write_text(t)
          PY
          python3 tools/repository_intelligence.py --config governance/repository-intelligence-config.json build
          git diff --check
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 -m tools.repository_validator
          python3 -m tools.evidence_state_check
          python3 tools/repository_intelligence.py --config governance/repository-intelligence-config.json verify
          python3 - <<'PY'
          import subprocess
          expected={'report/appendices/mechanism-hypotheses.md','evidence/primary/2026-chen-stratton-firm-production.md','governance/reviews/issue-110-2026-10-23-integration.md','governance/memory.md','governance/repository-intelligence/agent-context.json'}
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()); assert actual==expected,(actual,expected)
          PY
          git add report/appendices/mechanism-hypotheses.md evidence/primary/2026-chen-stratton-firm-production.md governance/reviews/issue-110-2026-10-23-integration.md governance/memory.md governance/repository-intelligence/agent-context.json
          git -c user.name='ChatGPT implementation agent' -c user.email='noreply@openai.com' commit -m 'Correct source link and firm-analysis denominator after independent review' -m 'Refs #110. Preserve findings and verdicts; independent acceptance remains pending.'
      - name: Trusted checks and publish candidate only
        run: |
          set -euo pipefail
          python3 trusted/tools/repository_gate.py --policy-root trusted --candidate-root candidate --repo candidate --base 939dd0805041debd69fde68a8467aa6202c51bc1 --head "$(git -C candidate rev-parse HEAD)"
          PYTHONPATH=trusted python3 trusted/tools/evidence_state_check.py --policy-root trusted --candidate-root candidate
          PYTHONPATH=trusted python3 trusted/tools/evidence_transition_gate.py --policy-root trusted --candidate-root candidate --repo candidate --base 939dd0805041debd69fde68a8467aa6202c51bc1
          test "$(git -C candidate ls-remote origin refs/heads/issue-110-core-comparison | cut -f1)" = a59c2f0d72366bef8cdddfa689f524fcda7ecd51
          git -C candidate push origin HEAD:refs/heads/issue-110-core-comparison
          git -C candidate rev-parse HEAD HEAD^{tree}
          git -C candidate archive --format=zip HEAD > issue-110-corrected-snapshot.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-110-corrected-snapshot
          path: issue-110-corrected-snapshot.zip
          retention-days: 1
