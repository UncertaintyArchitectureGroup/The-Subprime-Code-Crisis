name: Issue 123 transient RI synchronization
on:
  push:
    branches:
      - issue-123-readme-migration-inventory
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.head_commit.message == 'issue123-sync-reviewed-ri'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove bootstrap and rebuild RI
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/issue-123-temporary-ri.yml
          python tools/repository_intelligence.py --config governance/repository-intelligence-config.json build
          python tools/repository_intelligence.py --config governance/repository-intelligence-config.json verify
          python -m tools.repository_validator
          python -m tools.evidence_state_check
          python -m unittest discover -s tests -q
          git diff --check
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email '199175422+chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add governance/repository-intelligence/agent-context.json
          git commit -m 'Sync issue 123 independent review receipt and RI'
          git push origin HEAD:issue-123-readme-migration-inventory
