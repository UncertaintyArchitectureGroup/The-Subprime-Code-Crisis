name: Issue 110 temporary candidate publisher
on:
  push:
    branches: [issue-110-workbench-20261023]
permissions:
  contents: write
jobs:
  candidate:
    if: github.ref == 'refs/heads/issue-110-workbench-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read transport files on isolated workbench branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: transport
          persist-credentials: false
      - name: Restore and verify exact locally tested patch
        working-directory: transport
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          parts=[Path(f'.issue110-workbench/part-{i}.txt').read_text().strip() for i in range(3)]
          # Two known literal transport slips; all resulting bytes must match the local patch hash.
          assert parts[0].count('GcfAtDHY+y8cYpTf5XMg') == 1
          assert parts[0].count('DgZDfud8NU+kn3fq9M7rJmv') == 1
          parts[0]=parts[0].replace('GcfAtDHY+y8cYpTf5XMg','GcfAtDHY+y8oTf5XMg').replace('DgZDfud8NU+kn3fq9M7rJmv','DgZDfud8NU+kn3fq9MNrJmv')
          raw=gzip.decompress(base64.b64decode(''.join(parts),validate=True))
          assert hashlib.sha256(raw).hexdigest() == '35aa7064d6720346999a8f1cc2138a6884ab6d2e13a5a8ab0d5c61e0bb127d04'
          Path('/tmp/issue110.patch').write_bytes(raw)
          print('Exact local content patch verified:',len(raw),'bytes')
          PY
      - name: Check out actual accepted baseline for the content candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 939dd0805041debd69fde68a8467aa6202c51bc1
          path: candidate
          fetch-depth: 0
      - name: Apply only approved content; reproduce exact tested tree
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 939dd0805041debd69fde68a8467aa6202c51bc1
          git worktree add --detach ../trusted 939dd0805041debd69fde68a8467aa6202c51bc1
          git apply --check --unidiff-zero /tmp/issue110.patch
          git apply --unidiff-zero /tmp/issue110.patch
          python3 tools/repository_intelligence.py --config governance/repository-intelligence-config.json build
          python3 - <<'PY'
          import subprocess
          paths=['CHANGELOG.md','README.md','evidence/SOURCES.md','governance/memory.md','governance/repository-intelligence/agent-context.json','report/appendices/mechanism-hypotheses.md','governance/reviews/issue-110-2026-10-23-integration.md','governance/reviews/issue-110-2026-10-23-numeric-checks.json','governance/reviews/issue-110-2026-10-23-source-manifest.json','governance/work-records/2026-10-23-issue-110-source-comparison.toml']
          names=['2026-writing-code-vs-shipping-code','2026-chen-stratton-firm-production','2023-copilot-task-productivity','2025-metr-experienced-developer-productivity','2026-metr-productivity-design-update','2025-xu-copilot-oss-activity','2026-agarwal-agent-adoption','2025-metr-task-horizon','2026-ai-impacts-skill-formation']
          paths += ['evidence/primary/'+n+'.md' for n in names]
          subprocess.run(['git','add','--',*paths],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          assert set(changed)==set(paths),changed
          tree=subprocess.check_output(['git','write-tree']).decode().strip()
          assert tree=='20181d81eae10a555fb028ce588c8728e00d8f01',tree
          print('Exact locally tested candidate tree:',tree)
          PY
          git diff --cached --check
          git config user.name 'ChatGPT implementation agent'
          git config user.email 'noreply@openai.com'
          git commit -m 'Compare nine accepted sources with the SDLC thesis and alternatives' -m 'Refs #110. Implement approved T1-T4. Preserve current source versions and scoped verdicts. Independent review unavailable; this candidate is not ready for merge or final verification.'
      - name: Run repository tests and candidate checks
        working-directory: candidate
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m tools.repository_validator --format github
          python3 -m tools.evidence_state_check
          python3 tools/repository_intelligence.py --config governance/repository-intelligence-config.json verify
      - name: Run unchanged trusted-base gates
        run: |
          set -euo pipefail
          python3 trusted/tools/repository_gate.py --policy-root trusted --candidate-root candidate --repo candidate --base 939dd0805041debd69fde68a8467aa6202c51bc1 --head "$(git -C candidate rev-parse HEAD)"
          PYTHONPATH=trusted python3 trusted/tools/evidence_state_check.py --policy-root trusted --candidate-root candidate
          PYTHONPATH=trusted python3 trusted/tools/evidence_transition_gate.py --policy-root trusted --candidate-root candidate --repo candidate --base 939dd0805041debd69fde68a8467aa6202c51bc1
      - name: Publish the tested draft branch only; never main
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 20181d81eae10a555fb028ce588c8728e00d8f01
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 939dd0805041debd69fde68a8467aa6202c51bc1
          test "$(git ls-remote origin refs/heads/issue-110-core-comparison | cut -f1)" = 939dd0805041debd69fde68a8467aa6202c51bc1
          git push origin HEAD:refs/heads/issue-110-core-comparison
          git rev-parse HEAD HEAD^{tree}
          echo 'Published an unreviewed candidate, not a merge or final verification.'
