name: Issue 120 publish verification metadata
on:
  push:
    branches: [issue-100-transfer-20261024]
    paths: [.github/workflows/issue-100-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      BASE: 7e40c0b7930d4a014483b51eda68dbed802c73e7
      TARGET: issue-120-final-verification
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 7e40c0b7930d4a014483b51eda68dbed802c73e7
          fetch-depth: 1
      - name: Apply the exact locally checked metadata change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test -z "$(git ls-remote --heads origin refs/heads/$TARGET)"
          mkdir -p /tmp/trusted /tmp/issue120-out
          git archive HEAD | tar -x -C /tmp/trusted
          python - <<'PY'
          import urllib.request,json,base64,os,hashlib
          sha='6c67ac2933e1034b95a32a5ad64f029d3a93f9d4'
          url=f'https://api.github.com/repos/UncertaintyArchitectureGroup/The-Subprime-Code-Crisis/git/blobs/{sha}'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          obj=json.load(urllib.request.urlopen(req)); data=base64.b64decode(obj['content'])
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
          open('/tmp/issue120-author.py','wb').write(data)
          PY
          python /tmp/issue120-author.py
      - name: Validate metadata and preserve accepted content
        run: |
          python tools/repository_intelligence.py --config governance/repository-intelligence-config.json build
          git add governance/repository-intelligence/agent-context.json
          test "$(git write-tree)" = 9ef2dbef938402cad17e6fd21c49ddec22545032
          test "$(git diff --cached --name-only | wc -l)" = 12
          git diff --cached --exit-code -- report protocols README.md REFERENCES.md AGENTS.md DOCTRINE.md GLOSSARY.md CONTRIBUTING.md CHANGELOG.md tools tests .github
          python -m unittest discover -s tests -p 'test_*.py' -v > /tmp/issue120-out/tests.log 2>&1
          python -m tools.repository_validator
          python -m tools.evidence_state_check
          python tools/repository_intelligence.py --config governance/repository-intelligence-config.json verify
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize eligible management-source verification metadata' -m 'Refs #120, #100. Accepted content and all Current use preserved; independent metadata-delta review and merge remain pending.'
          PYTHONPATH=/tmp/trusted python /tmp/trusted/tools/repository_gate.py --policy-root /tmp/trusted --candidate-root "$PWD" --repo "$PWD" --base "$BASE" --head HEAD
          PYTHONPATH=/tmp/trusted python /tmp/trusted/tools/evidence_state_check.py --policy-root /tmp/trusted --candidate-root "$PWD"
          PYTHONPATH=/tmp/trusted python /tmp/trusted/tools/evidence_transition_gate.py --policy-root /tmp/trusted --candidate-root "$PWD" --repo "$PWD" --base "$BASE"
      - name: Publish isolated metadata branch and exact artifact
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test -z "$(git ls-remote --heads origin refs/heads/$TARGET)"
          git push origin HEAD:refs/heads/$TARGET
          git show -s --format='%H %T %P' HEAD > /tmp/issue120-out/identity.txt
          git diff --binary "$BASE" HEAD > /tmp/issue120-out/metadata.patch
          git archive --format=zip HEAD > /tmp/issue120-out/repository.zip
          git diff --stat "$BASE" HEAD > /tmp/issue120-out/diff-stat.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue120-metadata-candidate
          path: /tmp/issue120-out/
          if-no-files-found: error
          retention-days: 3
