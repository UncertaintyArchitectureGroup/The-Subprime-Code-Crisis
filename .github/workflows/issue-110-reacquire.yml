name: Issue 110 temporary access-correction publisher
on:
  push:
    branches: [issue-110-workbench-20261023]
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/issue-110-workbench-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: transport
          persist-credentials: false
      - name: Restore exact tested correction
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib
          raw=gzip.decompress(base64.b64decode(pathlib.Path('transport/.issue110-workbench/access-correction.b64').read_text().strip(),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='0f98d9c4470404184c366a189cf2b7a5f06e82423fb4bebf9fd64f24b71fa9ad'
          pathlib.Path('/tmp/correction.patch').write_bytes(raw)
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: b110235e78294adcd46ba83da14d1b6bf30c5599
          path: candidate
          fetch-depth: 0
      - name: Apply correction and assert exact tree
        working-directory: candidate
        run: |
          set -euo pipefail
          git worktree add --detach ../trusted 939dd0805041debd69fde68a8467aa6202c51bc1
          git apply --check --unidiff-zero /tmp/correction.patch
          git apply --unidiff-zero /tmp/correction.patch
          python3 tools/repository_intelligence.py --config governance/repository-intelligence-config.json build
          git add evidence/primary/2026-writing-code-vs-shipping-code.md governance/memory.md governance/repository-intelligence/agent-context.json governance/reviews/issue-110-2026-10-23-integration.md governance/reviews/issue-110-2026-10-23-nber-access.json governance/work-records/2026-10-23-issue-110-source-comparison.toml report/appendices/mechanism-hypotheses.md
          test "$(git diff --cached --name-only | wc -l)" = 7
          test "$(git write-tree)" = e7395b365181c8151ee9d4b370ef8a56f44fe1f3
          git diff --cached --check
          git config user.name 'ChatGPT implementation agent'
          git config user.email 'noreply@openai.com'
          git commit -m 'Authenticate accepted NBER object and record independent review correction' -m 'Refs #110. Publisher SHA256 matched exactly; full independent acceptance still pending. No source substitution or final verification.'
      - name: Recheck candidate and unchanged trusted gates
        run: |
          set -euo pipefail
          cd candidate
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 -m tools.repository_validator --format github
          python3 -m tools.evidence_state_check
          python3 tools/repository_intelligence.py --config governance/repository-intelligence-config.json verify
          cd ..
          python3 trusted/tools/repository_gate.py --policy-root trusted --candidate-root candidate --repo candidate --base 939dd0805041debd69fde68a8467aa6202c51bc1 --head "$(git -C candidate rev-parse HEAD)"
          PYTHONPATH=trusted python3 trusted/tools/evidence_state_check.py --policy-root trusted --candidate-root candidate
          PYTHONPATH=trusted python3 trusted/tools/evidence_transition_gate.py --policy-root trusted --candidate-root candidate --repo candidate --base 939dd0805041debd69fde68a8467aa6202c51bc1
      - name: Publish correction only to the existing draft branch
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 939dd0805041debd69fde68a8467aa6202c51bc1
          test "$(git ls-remote origin refs/heads/issue-110-core-comparison | cut -f1)" = b110235e78294adcd46ba83da14d1b6bf30c5599
          test "$(git rev-parse HEAD^{tree})" = e7395b365181c8151ee9d4b370ef8a56f44fe1f3
          git push origin HEAD:refs/heads/issue-110-core-comparison
          git rev-parse HEAD HEAD^{tree}
